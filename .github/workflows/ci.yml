name: CI
on:
  push:
  pull_request:
jobs:
  compile-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-windows-x64
          path: |
            build/Release/astra-studio.exe
            build/Release/web/
      - name: Package Unix app
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-${{ runner.os }}
          path: |
            build/astra-studio
            build/web/
  sanitizer:
    name: Address/UB Sanitizers (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DASTRA_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Tests
        run: ctest --test-dir build-asan --output-on-failure
